<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Softprobe and thelake layered architecture</title><desc id="desc">Four simple layers show agent and application telemetry flowing through OpenTelemetry into the thelake runtime, DuckLake and Parquet storage, then session queries in Softprobe Explorer.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <g id="lake"><rect width="42" height="42" rx="10" fill="#251f19"/><path d="M10 16h22M10 21h22M10 27h22" stroke="#f7f7f4" stroke-width="2.4" stroke-linecap="round"/><path d="M10 16h14" stroke="#f48d16" stroke-width="2.4" stroke-linecap="round"/></g>
    <g id="softprobe"><g fill="none" stroke="#101014" stroke-width="3.7" stroke-linejoin="round"><path d="M14 3h16a7 7 0 0 1 7 7v16a7 7 0 0 1-7 7H14a7 7 0 0 1-7-7V10a7 7 0 0 1 7-7Z"/><path d="m18 1 15 4a7 7 0 0 1 5 9l-4 15a7 7 0 0 1-9 5L10 30a7 7 0 0 1-5-9l4-15a7 7 0 0 1 9-5Z"/></g><path fill="#f48d16" d="m19 14 6 2a4 4 0 0 1 2.8 4.9l-1.6 5.8a4 4 0 0 1-4.9 2.8l-5.8-1.6a4 4 0 0 1-2.8-4.9l1.6-5.8A4 4 0 0 1 19 14Z"/></g>
    <g id="agent" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="30" height="23" rx="5"/><path d="M14 34h12M20 30v4M13 17h.1M27 17h.1M14 23c3 3 9 3 12 0"/></g>
    <g id="db" fill="none" stroke="#334155" stroke-width="2.2"><ellipse cx="20" cy="8" rx="15" ry="5"/><path d="M5 8v21c0 3 7 6 15 6s15-3 15-6V8M5 18c0 3 7 5 15 5s15-2 15-5"/></g>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>
  <text x="84" y="83" fill="#0f172a" font-family="Arial,sans-serif" font-size="32" font-weight="700">Agent evidence, layer by layer</text>
  <text x="84" y="116" fill="#64748b" font-family="Arial,sans-serif" font-size="17">A simple path from capture to review</text>
  <g font-family="Arial,sans-serif">
    <rect x="185" y="151" width="830" height="100" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="225" cy="201" r="25" fill="#e0f2fe"/><use href="#agent" x="205" y="181" width="40" height="40"/>
    <text x="270" y="194" fill="#0f172a" font-size="21" font-weight="700">Agents and applications</text><text x="270" y="222" fill="#64748b" font-size="15">Produce traces and session events</text>
    <path d="M604 176v50" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="650" cy="201" r="25" fill="#fff7ed"/><circle cx="643" cy="194" r="4" fill="#f48d16"/><circle cx="657" cy="194" r="4" fill="#425cc7"/><circle cx="650" cy="208" r="4" fill="#f48d16"/><path d="m645 197 3 7m7-7-3 7" stroke="#64748b" stroke-width="2"/>
    <text x="692" y="194" fill="#0f172a" font-size="21" font-weight="700">OpenTelemetry · OTLP</text><text x="692" y="222" fill="#64748b" font-size="15">Standard ingest path</text>
    <path d="M600 254v22" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="185" y="287" width="830" height="90" rx="16" fill="#eaf5f7" stroke="#84bac3" stroke-width="2"/>
    <use href="#lake" x="220" y="311" width="42" height="42"/><text x="286" y="329" fill="#0f172a" font-size="22" font-weight="700">thelake runtime</text><text x="286" y="354" fill="#526878" font-size="15">Authenticated ingest and tenant routing</text>
    <path d="M600 380v22" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="185" y="413" width="830" height="116" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="220" y="444" fill="#64748b" font-size="13" font-weight="700" letter-spacing="1.5">DURABLE EVIDENCE</text>
    <use href="#db" x="220" y="458" width="40" height="40"/><text x="275" y="478" fill="#0f172a" font-size="20" font-weight="700">DuckLake</text><text x="275" y="504" fill="#64748b" font-size="15">Catalog and snapshots</text>
    <path d="M590 451v62" stroke="#e2e8f0" stroke-width="2"/>
    <g transform="translate(633 461)" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"><path d="M0 8 24 0l24 8-24 8z"/><path d="M0 17 24 9l24 8-24 8z"/><path d="M0 26 24 18l24 8-24 8z"/></g><text x="700" y="478" fill="#0f172a" font-size="20" font-weight="700">Parquet files</text><text x="700" y="504" fill="#64748b" font-size="15">Columnar session data</text>
    <path d="M600 532v22" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="185" y="565" width="830" height="106" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="235" cy="618" r="25" fill="#eef2ff"/><path d="M224 618a11 11 0 1 1 3 8m-3 3v-8h8" fill="none" stroke="#425cc7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="280" y="610" fill="#0f172a" font-size="21" font-weight="700">Session queries</text><text x="280" y="638" fill="#64748b" font-size="15">Read evidence for inspection</text>
    <path d="M604 588v60" stroke="#e2e8f0" stroke-width="2"/>
    <use href="#softprobe" x="650" y="594" width="46" height="46"/><text x="714" y="610" fill="#0f172a" font-size="21" font-weight="700">Softprobe Explorer</text><text x="714" y="638" fill="#64748b" font-size="15">Inspect sessions and steps</text>
  </g>
  <text x="600" y="718" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Sources → OTLP → runtime → lake evidence → session queries</text>
</svg>
